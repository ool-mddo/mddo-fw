interfaces {
    /*eth1*/
    eth1 {
        description "to_Seg-172.32.1.0-30_Ethernet1"
        unit 0 {
            mtu 1500
            family inet {
                address 172.32.1.1/30;
            }
        }
    }
    /*eth2*/
    eth2 {
        description "to_Seg-172.16.1.0-30_Ethernet1"
        unit 0 {
            mtu 1500
            family inet {
                address 172.16.1.1/30;
            }
        }
    }
    /*eth3*/
    eth3 {
        description "to_Seg-172.16.2.0-30_Ethernet2"
        unit 0 {
            mtu 1500
            family inet {
                address 172.16.2.1/30;
            }
        }
    }
}
routing-instances {
    mgmt {
        instance-type vrf;
        interface eth0;
        route-distinguisher 65000:1;
        vrf-target target:65000:1;
    }
}
routing-options {
}
routing-options {
}

routing-options {
    router-id 172.16.0.1;
}
routing-options {
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface eth1 {
                metric 1;
                interface-type p2p;
                priority 10;
                hello-interval 10;
                dead-interval 40;
            }
        }
    }
}
protocols {
    ospf {
        area 0.0.0.10 {
            interface eth2 {
                metric 1;
                interface-type p2p;
                priority 10;
                hello-interval 10;
                dead-interval 40;
            }
            interface eth3 {
                metric 1;
                interface-type p2p;
                priority 10;
                hello-interval 10;
                dead-interval 40;
            }
        }
    }
}