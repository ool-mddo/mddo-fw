interfaces {
    /*ge-0/0/0.0*/
    eth1 {
        description "to_site-a-fw-2_ge-7/0/2"
        unit 0 {
            mtu 1500
            family inet {
                address 192.168.2.2/30;
            }
        }
    }
    /*ge-0/0/1.0*/
    eth2 {
        description "to_site-a-cr-1_eth2"
        unit 0 {
            mtu 1500
            family inet {
                address 192.168.0.2/30;
            }
        }
    }
    /*ge-0/0/2.0*/
    eth3 {
        description "to_Seg-192.168.100.0-24_Ethernet2"
        unit 0 {
            mtu 1500
            family inet {
                address 192.168.100.3/24 {
                    vrrp-group 1 {
                        virtual-address 192.168.100.1 {
                            device-name  eth3;
                        }
                        priority 100;
                        accept-data;
                    }
                }
            }
        }
    }
    /*ge-0/0/3.0*/
    eth4 {
        description "to_Seg-192.168.200.0-24_Ethernet2"
        unit 0 {
            mtu 1500
            family inet {
                address 192.168.200.3/24 {
                    vrrp-group 2 {
                        virtual-address 192.168.200.1 {
                            device-name  eth4;
                        }
                        priority 100;
                        accept-data;
                    }
                }
            }
        }
    }
}
routing-instances {
    mgmt {
        instance-type vrf;
        interface eth0;
        route-distinguisher 65000:1;
        vrf-target target:65000:1;
    }
}
routing-options {
}
routing-options {
}

routing-options {
    router-id 192.168.0.2;
}
routing-options {
}
protocols {
    ospf {
        area 0.0.0.10 {
            interface eth1 {
                metric 1;
                interface-type p2p;
                priority 10;
                hello-interval 10;
                dead-interval 40;
            }
            interface eth2 {
                metric 1;
                interface-type p2p;
                priority 10;
                hello-interval 10;
                dead-interval 40;
            }
            interface eth3 {
                metric 1;
                passive;
                priority 10;
                hello-interval 10;
                dead-interval 40;
            }
            interface eth4 {
                metric 1;
                passive;
                priority 10;
                hello-interval 10;
                dead-interval 40;
            }
        }
    }
}