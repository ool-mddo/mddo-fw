security {
    policies {
        from-zone trust to-zone trust {
            policy default-permit {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone trust to-zone untrust {
            policy default-permit {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone WAN to-zone LAN {
            policy DEFAULT {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                }
            }
        }
        from-zone LAN to-zone WAN {
            policy DEFAULT {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }
    zones {
        security-zone trust {
        }
        security-zone untrust {
        }
        security-zone WAN {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/1.0;
                ge-7/0/1.0;
            }
        }
        security-zone LAN {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/2.0;
                ge-7/0/2.0;
            }
        }
    }
}
interfaces {
    ge-0/0/1 {
        description "to_site-a-br-1_ge-0/0/3";
        unit 0 {
            family inet {
                address 172.16.1.2/30;
            }
        }
    }
    ge-0/0/2 {
        description "to_site-a-cr-1_ge-0/0/0";
        unit 0 {
            family inet {
                address 192.168.1.1/30;
            }
        }
    }
    ge-7/0/2 {
        description "to_site-a-cr-2_ge-0/0/0";
        unit 0 {
            family inet {
                address 192.168.2.1/30;
            }
        }
    }
    ge-7/0/1 {
        description "to_site-a-br-2_ge-0/0/3";
        unit 0 {
            family inet {
                address 172.16.2.2/30;
            }
        }
    }
    fab0 {
        fabric-options {
            member-interfaces {
                ge-0/0/0;
            }
        }
    }
    fab1 {
        fabric-options {
            member-interfaces {
                ge-7/0/0;
            }
        }
    }
}
protocols {
    ospf {
        area 0.0.0.10 {
            interface ge-0/0/1.0 {
                interface-type p2p;
                metric 1;
                priority 10;
                hello-interval 10;
                dead-interval 40;
            }
            interface ge-0/0/2.0 {
                interface-type p2p;
                metric 1;
                priority 10;
                hello-interval 10;
                dead-interval 40;
            }
            interface ge-7/0/1.0 {
                interface-type p2p;
                metric 1;
                priority 10;
                hello-interval 10;
                dead-interval 40;
            }
            interface ge-7/0/2.0 {
                interface-type p2p;
                metric 1;
                priority 10;
                hello-interval 10;
                dead-interval 40;
            }
        }
    }
}