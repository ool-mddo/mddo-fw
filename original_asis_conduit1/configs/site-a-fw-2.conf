    root-authentication {
        encrypted-password "$6$Wt7I8QLq$3TB.yBWooA9JxW/JjRVsFfpzhRKAKftH7mxweAl9wqqqIIvo9ekOrZ8Dm6HHXj87jvp/RVoSqDJzbiivMXTqs/"; 
    }
    login {
        user vrnetlab {
            uid 2000;
            class super-user;
            authentication {
                encrypted-password "$6$CDmzGe/d$g43HmhI3FA.21JCYppnTg1h4q/JO4DOHSICLhhavqBem5zUTgKEcg5m9tBG1Ik6qmfb7L3v.wgj4/DkfgZejO0"; ## SECRET-DATA
